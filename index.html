<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Iso Draw</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --text: #2b2a27; --muted: #8a867c;
    --border: #ddd7c9; --accent: #2f6fde;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181b; --panel: #222428; --text: #e8e6e1; --muted: #8d9097;
    --border: #34373d; --accent: #6ea3ff;
  }
  :root[data-theme="dark"] #bar button.on, :root[data-theme="dark"] dialog button.primary { color: #10131a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  canvas.pan { cursor: grab; }
  canvas.erase { cursor: default; }
  canvas.erase.hit { cursor: pointer; }
  canvas.panning, canvas.erase.panning { cursor: grabbing; }
  #bar { position: fixed; top: 12px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: flex; align-items: center; justify-content: center; gap: 2px; padding: 5px 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.12); user-select: none; max-width: calc(100vw - 24px); flex-wrap: wrap; }
  #bar button, #layers button { font: inherit; color: var(--text); background: transparent; border: 1px solid transparent;
    border-radius: 8px; padding: 0; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; flex: none; }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; display: block; }
  #bar button:hover, #layers button:hover { background: rgba(127,127,127,.14); }
  #bar button.on { background: var(--accent); color: #fff; }
  #bar button:disabled, #layers button:disabled { opacity: .3; cursor: default; background: transparent; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: none; }
  #swatches { display: flex; gap: 4px; flex-wrap: wrap; max-width: 260px; margin: 0 2px; }
  #bar .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel);
    outline: 1px solid var(--border); }
  #bar .sw.on { outline: 2px solid var(--accent); }
  #width { width: 56px; accent-color: var(--accent); margin: 0 4px; }

  /* layers panel */
  #layers { position: fixed; left: 12px; top: 100px; width: 232px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.12); user-select: none; }
  #layers.min { width: auto; }
  #layers.min #layerBody { display: none; }
  #layersHead { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; font-weight: 600; }
  #layersHead .grow { flex: 1; }
  #layers button { width: 26px; height: 26px; border-radius: 6px; }
  #layers svg.ic { width: 16px; height: 16px; }
  #layerList { max-height: min(46vh, 340px); overflow-y: auto; padding: 2px 6px; display: grid; gap: 2px; }
  .layer { display: flex; align-items: center; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .layer:hover { background: rgba(127,127,127,.1); }
  .layer.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .layer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 2px; }
  .layer.off .name { opacity: .45; }
  .layer input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--accent); border-radius: 6px; padding: 3px 4px; }
  .layer.dropAbove { box-shadow: 0 -2px 0 var(--accent); }
  .layer.dropBelow { box-shadow: 0 2px 0 var(--accent); }
  #layerFoot { padding: 4px 6px 6px; }
  #layers #addLayer { width: 100%; display: flex; gap: 6px; justify-content: center; align-items: center;
    border: 1px dashed var(--border); color: var(--muted); }
  #hud { position: fixed; left: 12px; bottom: 10px; color: var(--muted); pointer-events: none;
    font-variant-numeric: tabular-nums; }
  #help { position: fixed; right: 12px; bottom: 10px; color: var(--muted); pointer-events: none; text-align: right; }
  @media (max-width: 720px) { #help { display: none; } }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: calc(100vw - 32px);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #palSel { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--border);
    border-radius: 8px; padding: 0 4px; height: 28px; max-width: 104px; cursor: pointer; }
  dialog { width: min(420px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 14px;
    background: var(--panel); color: var(--text); padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 12px; font-size: 16px; }
  dialog label { display: block; margin-bottom: 10px; color: var(--muted); }
  dialog input:not([type=color]), dialog textarea { display: block; width: 100%; margin-top: 4px; font: inherit;
    color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; resize: vertical; }
  dialog .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  dialog .grow { flex: 1; }
  dialog button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: none; }
  #palChips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; min-height: 30px; }
  #palChips button { width: 30px; height: 30px; padding: 0; border-radius: 8px; }
  #palChips button:hover { outline: 2px solid #e5484d; }
  #palMsg { color: var(--muted); margin-top: 8px; min-height: 17px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="tLine" data-icon="line" title="Line (L)"></button>
  <button id="tFree" data-icon="free" title="Freehand; the two ends snap (F)"></button>
  <button id="tFill" data-icon="fill" title="Fill area: click points for the boundary, then click the first point again or press Enter (B)"></button>
  <button id="tErase" data-icon="eraser" title="Eraser: click or drag over strokes on the current layer (E)"></button>
  <button id="tPick" data-icon="dropper" title="Eyedropper: click a stroke or fill to take its colour (I)"></button>
  <div class="sep"></div>
  <span id="swatches"></span>
  <select id="palSel" title="Colour palettes: switch, create, import, edit"></select>
  <input id="width" type="range" min="1" max="12" step="0.5" value="2.5" title="Line width">
  <div class="sep"></div>
  <button id="undo" data-icon="undo" title="Undo (⌘Z)"></button>
  <button id="redo" data-icon="redo" title="Redo (⇧⌘Z)"></button>
  <button id="clear" data-icon="trash" title="Clear every layer (undoable)"></button>
  <div class="sep"></div>
  <button id="grid" data-icon="grid" title="Show / hide grid points (G)"></button>
  <button id="theme" data-icon="moon" title="Dark mode on / off (D)"></button>
  <button id="home" data-icon="target" title="Reset view (0)"></button>
  <div class="sep"></div>
  <button id="save" data-icon="save" title="Save drawing to a file (⌘S)"></button>
  <button id="import" data-icon="open" title="Import a saved drawing; replaces the current one, undoable (⌘O)"></button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</div>
<div id="layers">
  <div id="layersHead">
    <span data-icon="layers"></span><span class="grow">Layers</span>
    <button id="layersMin"></button>
  </div>
  <div id="layerBody">
    <div id="layerList"></div>
    <div id="layerFoot"><button id="addLayer" title="Add a new layer above the current one"></button></div>
  </div>
</div>
<div id="hud"></div>
<div id="toast"></div>

<dialog id="palDlg">
  <h3 id="palTitle">New palette</h3>
  <label>Name
    <input id="palName" maxlength="40">
  </label>
  <label>Import: paste a Coolors link, or any text containing hex colours
    <textarea id="palPaste" rows="3" placeholder="https://coolors.co/264653-2a9d8f-e9c46a-f4a261-e76f51"></textarea>
  </label>
  <div class="row">
    <button type="button" id="palParse">Add pasted colours</button>
    <span class="grow"></span>
    <input type="color" id="palPick" value="#2f6fde" title="Pick a colour">
    <button type="button" id="palAdd">Add picked colour</button>
  </div>
  <div id="palChips"></div>
  <div id="palMsg"></div>
  <div class="row">
    <span class="grow"></span>
    <button type="button" id="palCancel">Cancel</button>
    <button type="button" id="palOk" class="primary">Save palette</button>
  </div>
</dialog>
<div id="help">scroll / pinch = zoom · space-drag or right-drag = pan</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  // ---------- grid math ----------
  // Isometric lattice with basis u = s*(√3/2, 1/2), v = s*(0, 1).
  // Spacing s is always a power of two, so every coarser level's points are
  // a subset of every finer level's: things you snapped to never disappear
  // from the lattice when you zoom in.
  const C = Math.sqrt(3) / 2;
  const MIN_PX = 22;                 // on-screen spacing stays in [22, 44) px
  const MIN_SCALE = 2 ** -20, MAX_SCALE = 2 ** 20;

  let scale = 1;                     // screen px per world unit
  let camX = 0, camY = 0;            // world coords of the screen's top-left
  let W = 0, H = 0, dpr = 1;

  const spacing = () => 2 ** Math.ceil(Math.log2(MIN_PX / scale));
  const toWorld = (sx, sy) => [camX + sx / scale, camY + sy / scale];
  const toScreen = (wx, wy) => [(wx - camX) * scale, (wy - camY) * scale];

  function snap(wx, wy) {
    const s = spacing();
    const i0 = Math.floor(wx / (C * s));
    let best = null, bd = Infinity;
    for (let i = i0; i <= i0 + 1; i++) {
      const j0 = Math.floor(wy / s - i / 2);
      for (let j = j0; j <= j0 + 1; j++) {
        const x = i * C * s, y = (i / 2 + j) * s;
        const d = (x - wx) ** 2 + (y - wy) ** 2;
        if (d < bd) { bd = d; best = [x, y]; }
      }
    }
    return best;
  }

  // ---------- state ----------
  const COLORS = ['ink', '#e5484d', '#f2992e', '#2fa36b', '#2f6fde', '#8e4ec6'];
  let tool = 'line', color = 'ink', width = 2.5;
  let strokes = [];                  // {tool, color, w, layer, pts:[[x,y],...]} in world coords
  let layers = [{ id: 1, name: 'Layer 1', visible: true }];   // bottom → top
  let activeLayer = 1;               // id of the layer new strokes go on
  let undoStack = [], redoStack = [];
  let draft = null;                  // stroke being drawn
  let hover = null;                  // snapped world point under cursor
  let eraseTarget = null;            // stroke the eraser would remove
  let fillDraft = null;              // fill polygon being outlined, point by point
  let showGrid = true;
  // Theme follows the system until the user picks one with the Dark button.
  const TKEY = 'iso-draw-theme';
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  let themeChoice = null;
  try { const t = localStorage.getItem(TKEY); if (t === 'dark' || t === 'light') themeChoice = t; } catch (e) {}
  let dark = themeChoice ? themeChoice === 'dark' : systemDark.matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  let pickTarget = null;             // stroke the eyedropper would sample
  let cursor = [0, 0];               // last pointer position, for the eyedropper preview
  let prevTool = 'line';             // tool to return to after picking a colour

  const KEY = 'iso-draw-v1';
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ strokes, layers, activeLayer, scale, camX, camY, showGrid })); } catch (e) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && Array.isArray(d.strokes)) {
        strokes = d.strokes;
        ({ layers, active: activeLayer } = normalizeDoc(d.layers, strokes, d.activeLayer));
        scale = d.scale; camX = d.camX; camY = d.camY; showGrid = d.showGrid !== false; return true; }
    } catch (e) {}
    return false;
  }
  // Make a layer list trustworthy and give every stroke a layer that exists.
  // Drawings saved before layers existed end up on a single "Layer 1".
  function normalizeDoc(rawLayers, list, active) {
    const ls = [];
    for (const l of Array.isArray(rawLayers) ? rawLayers : []) {
      if (l && Number.isInteger(l.id) && !ls.some(x => x.id === l.id)) {
        ls.push({ id: l.id, name: String(l.name || `Layer ${l.id}`).slice(0, 40), visible: l.visible !== false });
      }
    }
    if (!ls.length) ls.push({ id: 1, name: 'Layer 1', visible: true });
    for (const st of list) if (!ls.some(l => l.id === st.layer)) st.layer = ls[0].id;
    return { layers: ls, active: ls.some(l => l.id === active) ? active : ls[ls.length - 1].id };
  }
  function homeView() { scale = 1; camX = -W / 2; camY = -H / 2; }

  // ---------- rendering ----------
  let queued = false;
  function redraw() { if (!queued) { queued = true; requestAnimationFrame(draw); } }

  function resize() {
    placeLayers();
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    redraw();
  }

  function buildGrid() {
    const s = spacing();
    const fade = s * scale / MIN_PX - 1;         // 0 → finest level just appeared, 1 → about to subdivide
    const [x0, y0] = toWorld(0, 0), [x1, y1] = toWorld(W, H);
    const tiers = [new Path2D(), new Path2D(), new Path2D()];
    const radii = [1.1, 1.5, 2.1];
    const iA = Math.ceil(x0 / (C * s)), iB = Math.floor(x1 / (C * s));
    for (let i = iA; i <= iB; i++) {
      const jA = Math.ceil(y0 / s - i / 2), jB = Math.floor(y1 / s - i / 2);
      const sx = (i * C * s - camX) * scale;
      for (let j = jA; j <= jB; j++) {
        const sy = ((i / 2 + j) * s - camY) * scale;
        const t = (i % 4 === 0 && j % 4 === 0) ? 2 : (i % 2 === 0 && j % 2 === 0) ? 1 : 0;
        tiers[t].moveTo(sx + radii[t], sy);
        tiers[t].arc(sx, sy, radii[t], 0, 6.2832);
      }
    }
    // Each tier eases toward the look of the tier above it as you zoom in,
    // so the subdivision is seamless.
    const a0 = 0.34 * Math.min(1, fade * 2.5), a1 = 0.34 + 0.16 * fade, a2 = 0.50 + 0.15 * fade;
    return { tiers, alphas: [a0, a1, a2] };
  }
  function paintGrid(g, rgb, boost) {
    g.alphas.forEach((a, t) => { ctx.fillStyle = `rgba(${rgb},${Math.min(0.9, a * boost)})`; ctx.fill(g.tiers[t]); });
  }
  // Dot colour that stays visible on top of a given fill colour.
  function dotRgbOn(c) {
    const n = parseInt(inkColor(c).slice(1), 16);
    const lum = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
    return lum > 0.55 ? '20,18,14' : '255,255,255';
  }
  function polyPath(pts) {
    const path = new Path2D();
    pts.forEach((p, k) => { const [x, y] = toScreen(p[0], p[1]); k ? path.lineTo(x, y) : path.moveTo(x, y); });
    path.closePath();
    return path;
  }

  const inkColor = c => c === 'ink' ? (dark ? '#f1efe9' : '#23211d') : c;

  function drawStroke(st, colorOverride, widthOverride) {
    const p = st.pts;
    if (p.length < 2) return;
    ctx.strokeStyle = colorOverride || inkColor(st.color);
    ctx.lineWidth = widthOverride || st.w;
    ctx.beginPath();
    let [x, y] = toScreen(p[0][0], p[0][1]);
    ctx.moveTo(x, y);
    if (p.length === 2) {
      [x, y] = toScreen(p[1][0], p[1][1]); ctx.lineTo(x, y);
    } else {
      for (let k = 1; k < p.length - 1; k++) {
        const [ax, ay] = toScreen(p[k][0], p[k][1]);
        const [bx, by] = toScreen(p[k + 1][0], p[k + 1][1]);
        ctx.quadraticCurveTo(ax, ay, (ax + bx) / 2, (ay + by) / 2);
      }
      [x, y] = toScreen(p[p.length - 1][0], p[p.length - 1][1]); ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function draw() {
    queued = false;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg');
    ctx.fillRect(0, 0, W, H);
    const grid = buildGrid();
    if (showGrid) paintGrid(grid, dark ? '255,255,255' : '40,36,28', 1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // Layers are painted bottom to top. Inside a layer: fills first, with the
    // grid dots re-drawn on each fill in a contrasting colour (so they show
    // through), then that layer's lines.
    for (const layer of layers) {
      if (!layer.visible) continue;
      for (const st of strokes) {
        if (st.layer !== layer.id || st.tool !== 'fill') continue;
        const path = polyPath(st.pts);
        ctx.fillStyle = inkColor(st.color); ctx.fill(path);
        if (showGrid) { ctx.save(); ctx.clip(path); paintGrid(grid, dotRgbOn(st.color), 1.6); ctx.restore(); }
      }
      if (fillDraft && fillDraft.layer === layer.id) {
        const pts = hover ? [...fillDraft.pts, hover] : fillDraft.pts;
        const path = polyPath(pts);
        ctx.globalAlpha = 0.4; ctx.fillStyle = inkColor(fillDraft.color); ctx.fill(path);
        ctx.globalAlpha = 1; ctx.strokeStyle = inkColor(fillDraft.color); ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]); ctx.stroke(path); ctx.setLineDash([]);
      }
      for (const st of strokes) if (st.layer === layer.id && st.tool !== 'fill') drawStroke(st);
      if (draft && draft.layer === layer.id) drawStroke(draft);
    }
    if (eraseTarget && eraseTarget.tool === 'fill') {
      const path = polyPath(eraseTarget.pts);
      ctx.fillStyle = 'rgba(229,72,77,0.55)'; ctx.fill(path);
      ctx.strokeStyle = '#e5484d'; ctx.lineWidth = 2.5; ctx.stroke(path);
    } else if (eraseTarget) {                    // red halo + red stroke = "this will be deleted"
      drawStroke(eraseTarget, 'rgba(229,72,77,0.32)', eraseTarget.w + 12);
      drawStroke(eraseTarget, '#e5484d');
    }

    const accent = dark ? '#6ea3ff' : '#2f6fde';
    const ring = (pt, r) => {
      const [x, y] = toScreen(pt[0], pt[1]);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
      ctx.strokeStyle = accent; ctx.lineWidth = 1.5; ctx.stroke();
    };
    if (draft) ring(draft.pts[0], 5);
    if (fillDraft) fillDraft.pts.forEach((p, k) => ring(p, k === 0 && fillDraft.pts.length >= 3 ? 9 : 4));
    if (tool === 'pick' && pickTarget) {         // bubble by the cursor showing the colour you'd get
      const x = cursor[0] + 18, y = cursor[1] - 18;
      ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.2832);
      ctx.fillStyle = inkColor(pickTarget.color); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.2832);
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
    }
    if (hover) ring(hover, 7);

    const z = scale >= 1 ? scale : 1 / scale;
    const zs = (z >= 100 ? Math.round(z).toLocaleString() : z.toPrecision(3)) + '×';
    hud.textContent = `zoom ${scale >= 1 ? zs : '1/' + zs} · grid 2^${Math.log2(spacing())} · ${strokes.length} stroke${strokes.length === 1 ? '' : 's'} · ${(layers.find(l => l.id === activeLayer) || {}).name}`;
  }

  // ---------- history ----------
  function commit(action) { undoStack.push(action); redoStack = []; syncUI(); save(); redraw(); }
  function undo() {
    if (fillDraft) {                             // mid-outline: step back one point
      fillDraft.pts.pop();
      if (!fillDraft.pts.length) fillDraft = null;
      syncUI(); redraw(); return;
    }
    const a = undoStack.pop(); if (!a) return;
    if (a.type === 'add') strokes.pop();
    else if (a.type === 'remove') strokes.splice(a.index, 0, a.stroke);
    else applyState(a.prev);
    setEraseTarget(null);
    redoStack.push(a); syncUI(); renderLayers(); save(); redraw();
  }
  function redo() {
    const a = redoStack.pop(); if (!a) return;
    if (a.type === 'add') strokes.push(a.stroke);
    else if (a.type === 'remove') strokes.splice(a.index, 1);
    else applyState(a.next);
    setEraseTarget(null);
    undoStack.push(a); syncUI(); renderLayers(); save(); redraw();
  }

  // Anything that changes layers (or many strokes at once) is recorded as a
  // before/after snapshot. Stroke objects are never modified after they are
  // drawn, so copying the arrays is enough.
  function snapshot() {
    return { strokes: strokes.slice(), layers: layers.map(l => ({ ...l })), active: activeLayer };
  }
  function applyState(st) {
    strokes = st.strokes.slice(); layers = st.layers.map(l => ({ ...l })); activeLayer = st.active;
    draft = null; fillDraft = null; hover = null; pickTarget = null;
  }
  function layerOp(change) {
    const prev = snapshot();
    change();
    draft = null; fillDraft = null; setEraseTarget(null);
    commit({ type: 'state', prev, next: snapshot() });
    renderLayers();
  }

  // ---------- save / import ----------
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }
  function exportFile() {
    const data = { app: 'iso-draw', version: 2, view: { scale, camX, camY }, showGrid, layers, activeLayer, strokes };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    const a = document.createElement('a');

      const pts = s.pts.filter(p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]))

      const runs = text.match(/\b[0-9a-f]{6}(?:-[0-9a-f]{6})*\b/gi) || [];

  $('import').onclick = () => $('file').click();
  $('file').onchange = e => { importFile(e.target.files[0]); e.target.value = ''; };
  // Dropping a saved file anywhere on the page imports it too.
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); importFile(e.dataTransfer.files[0]); });
  $('undo').onclick = undo;
  $('redo').onclick = redo;
  $('clear').onclick = () => { if (strokes.length) layerOp(() => { strokes = []; }); };
  $('home').onclick = () => { homeView(); save(); redraw(); };
  $('width').oninput = e => { width = +e.target.value; };

  // ---------- layers panel ----------
  const UKEY = 'iso-draw-ui';
  let layersMin = false, dragId = null;
  try { layersMin = !!JSON.parse(localStorage.getItem(UKEY)).layersMin; } catch (e) {}
  const layerIndex = id => layers.findIndex(l => l.id === id);

  function selectLayer(id) {
    if (activeLayer === id) return;
    activeLayer = id; fillDraft = null; setEraseTarget(null);
    // Only restyle the rows (no rebuild), so a double-click to rename still lands on the same row.
    document.querySelectorAll('.layer').forEach(r => r.classList.toggle('active', +r.dataset.id === id));
    syncUI(); save(); redraw();
  }
  function addLayer() {
    layerOp(() => {
      const id = Math.max(...layers.map(l => l.id)) + 1;
      layers.splice(layerIndex(activeLayer) + 1, 0, { id, name: `Layer ${id}`, visible: true });
      activeLayer = id;
    });
  }
  function deleteLayer(id) {
    if (layers.length < 2) return;
    layerOp(() => {
      const i = layerIndex(id);
      layers.splice(i, 1);
      strokes = strokes.filter(st => st.layer !== id);
      if (activeLayer === id) activeLayer = layers[Math.min(i, layers.length - 1)].id;
    });
  }
  function moveLayer(id, dir) {                  // dir +1 = toward the top
    const i = layerIndex(id), j = i + dir;
    if (j < 0 || j >= layers.length) return;
    layerOp(() => { [layers[i], layers[j]] = [layers[j], layers[i]]; });
  }
  function toggleLayer(id) {
    const l = layers[layerIndex(id)];
    l.visible = !l.visible;
    hover = null; pickTarget = null; fillDraft = null; setEraseTarget(null);
    save(); renderLayers(); redraw();
  }
  function renameLayer(id, span) {
    const input = document.createElement('input');
    input.value = layers[layerIndex(id)].name; input.maxLength = 40;
    span.replaceWith(input); input.focus(); input.select();
    let done = false;
    const finish = keep => {
      if (done) return; done = true;
      const v = input.value.trim(), l = layers[layerIndex(id)];
      if (keep && v && l && v !== l.name) layerOp(() => { layers[layerIndex(id)].name = v; });
      else renderLayers();
    };
    input.onkeydown = e => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); };
    input.onblur = () => finish(true);
    input.onclick = e => e.stopPropagation();
  }

  // The panel sits just under the toolbar, however many rows the toolbar wraps to.
  function placeLayers() {
    document.getElementById('layers').style.top = document.getElementById('bar').getBoundingClientRect().bottom + 10 + 'px';
  }
  function renderLayers() {
    $('layers').classList.toggle('min', layersMin);
    const mb = $('layersMin');
    mb.innerHTML = svg(layersMin ? 'expand' : 'collapse');
    mb.title = layersMin ? 'Show the layers panel' : 'Minimise the layers panel';
    mb.setAttribute('aria-label', mb.title);
    const list = $('layerList'); list.textContent = '';
    for (let n = layers.length - 1; n >= 0; n--) {          // top layer first, like a stack
      const l = layers[n];
      const row = document.createElement('div');
      row.className = 'layer' + (l.id === activeLayer ? ' active' : '') + (l.visible ? '' : ' off');
      row.dataset.id = l.id; row.draggable = true;
      row.title = 'Click to draw on this layer · double-click the name to rename · drag to reorder';
      const btn = (icon, title, fn, disabled) => {
        const b = document.createElement('button');
        b.innerHTML = svg(icon); b.title = title; b.setAttribute('aria-label', title); b.disabled = !!disabled;
        b.onclick = e => { e.stopPropagation(); fn(); };
        row.appendChild(b);
      };
      btn(l.visible ? 'eye' : 'eyeOff', l.visible ? 'Hide this layer' : 'Show this layer', () => toggleLayer(l.id));
      const name = document.createElement('span');
      name.className = 'name'; name.textContent = l.name;
      name.ondblclick = () => renameLayer(l.id, name);
      row.appendChild(name);
      btn('up', 'Move layer up', () => moveLayer(l.id, 1), n === layers.length - 1);
      btn('down', 'Move layer down', () => moveLayer(l.id, -1), n === 0);
      btn('x', 'Delete this layer and everything on it (undoable)', () => deleteLayer(l.id), layers.length === 1);
      row.onclick = () => selectLayer(l.id);

      const dropAbove = e => { const r = row.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; };
      const clearMarks = () => row.classList.remove('dropAbove', 'dropBelow');
      row.ondragstart = e => { dragId = l.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(l.id)); };
      row.ondragend = () => { dragId = null; };
      row.ondragleave = clearMarks;
      row.ondragover = e => {
        if (dragId == null || dragId === l.id) return;
        e.preventDefault(); e.stopPropagation();
        const above = dropAbove(e);
        row.classList.toggle('dropAbove', above); row.classList.toggle('dropBelow', !above);
      };
      row.ondrop = e => {
        e.preventDefault(); e.stopPropagation(); clearMarks();
        const id = dragId, above = dropAbove(e); dragId = null;
        if (id == null || id === l.id) return;
        layerOp(() => {
          const moved = layers.splice(layerIndex(id), 1)[0];
          layers.splice(layerIndex(l.id) + (above ? 1 : 0), 0, moved);   // "above" on screen = later in the stack
        });
      };
      list.appendChild(row);
    }
  }
  $('addLayer').innerHTML = svg('plus') + '<span>New layer</span>';
  $('addLayer').onclick = addLayer;
  $('layersMin').onclick = () => {
    layersMin = !layersMin;
    try { localStorage.setItem(UKEY, JSON.stringify({ layersMin })); } catch (e) {}
    renderLayers();
  };

  function setTheme(d, remember = true) {
    dark = d;
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
    if (remember) { themeChoice = d ? 'dark' : 'light'; try { localStorage.setItem(TKEY, themeChoice); } catch (e) {} }
    syncUI(); redraw();
  }
  systemDark.addEventListener('change', e => { if (!themeChoice) setTheme(e.matches, false); });
  addEventListener('resize', resize);

  W = innerWidth; H = innerHeight;
  if (!load()) homeView();
  syncUI();
  renderLayers();
  resize();
})();
</script>
</body>
</html>
